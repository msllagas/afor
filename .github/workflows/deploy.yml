name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install PHP Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Node Dependencies
        run: npm ci

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Prettier
        run: npm run format:check

      # Build first so Wayfinder generates types (actions, routes, wayfinder dirs)
      - name: Build
        run: npm run build

      - name: ESLint
        run: npm run lint:check

      - name: TypeScript
        run: npm run types:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint  # blocked if lint fails

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: afor-test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Patch environment for CI
        run: |
          echo "DB_CONNECTION=mysql"            >> .env
          echo "DB_HOST=127.0.0.1"              >> .env
          echo "DB_PORT=3306"                   >> .env
          echo "DB_DATABASE=afor-test"          >> .env
          echo "DB_USERNAME=root"               >> .env
          echo "DB_PASSWORD=secret"             >> .env

      - name: Build Assets
        run: npm run build

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Tests
        run: ./vendor/bin/pest

