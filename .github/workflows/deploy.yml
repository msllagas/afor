name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Node Dependencies
        run: npm ci

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Prettier
        run: npm run format:check

      # Build first so Wayfinder generates types (actions, routes, wayfinder dirs)
      - name: Build
        run: npm run build

      - name: ESLint
        run: npm run lint:check

      - name: TypeScript
        run: npm run types:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Runs next to lint rather than after it, so a style nit doesn't hide a failing test.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: afor-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d afor-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Real environment variables win over .env and the defaults in phpunit.xml.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: afor-test
      DB_USERNAME: postgres
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Node Dependencies
        run: npm ci

      - name: Install PHP Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      # The board page's browser tests drive Chromium through Playwright.
      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      # The tests refresh the database themselves, so this also proves every migration runs on PostgreSQL.
      - name: Run Tests
        run: ./vendor/bin/pest --ci --trace

      - name: Upload Browser Test Screenshots and Traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-tests
          path: |
            tests/Browser/Screenshots
            tests/Browser/Traces
          if-no-files-found: ignore

  deploy:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: [lint, test]  # blocked if lint or test fails
    timeout-minutes: 15
    # Temporarily disabled: remove `false &&` to re-enable deploys
    if: false && github.event_name == 'push'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /var/www/afor
            git pull origin main
            composer install --no-dev --optimize-autoloader
            npm ci && npm run build
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan queue:restart
            sudo systemctl restart php8.4-fpm
            sudo systemctl restart nginx
